<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add a Car</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6" style="margin-top: 50px;">
            <div class="card border-info">
                <div class="card-header bg-info text-white">
                    <h4>Add New Car</h4>
                </div>
                <div class="card-body">
                    <form action="#" th:action="@{/employee/processCarsForm}"
                          th:object="${car}"
                          enctype="multipart/form-data"
                          method="POST">

                        <!-- Car Model selection -->
                        <div class="mb-3">
                            <label for="carModel" class="form-label">Car Model *</label>
                            <div class="d-flex gap-2">
                                <select id="carModel" th:field="*{carModelId}" class="form-control" required>
                                    <option value="">Select Car Model</option>
                                    <option th:each="carModel : ${carModels}"
                                            th:value="${carModel.carModelId}"
                                            th:text="${carModel.brand + ' ' + carModel.model + ' (' + carModel.year + ') - ' + carModel.pricePerDay + ' RON/day'}">
                                    </option>
                                </select>
                                <a th:href="@{/employee/addCarModelForm}"
                                   class="btn btn-outline-primary btn-sm" title="Add New Car Model">+</a>
                            </div>
                        </div>

                        <!-- Physical car details -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="licencePlate" class="form-label">License Plate *</label>
                                <input type="text" id="licencePlate" th:field="*{licencePlate}"
                                       placeholder="e.g. B123ABC" maxlength="7"
                                       class="form-control" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="color" class="form-label">Color *</label>
                                <input type="text" id="color" th:field="*{color}"
                                       placeholder="e.g. Red" class="form-control" required/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="mileage" class="form-label">Mileage (km) *</label>
                                <input type="number" id="mileage" th:field="*{mileage}"
                                       placeholder="e.g. 15000" min="0"
                                       class="form-control" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="imageFile" class="form-label">Car Image</label>
                                <input id="imageFile" name="imageFile" type="file"
                                       accept="image/jpeg,image/png" class="form-control"/>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/cars/showCars}" class="btn btn-secondary">Back to Cars</a>
                            <button type="submit" class="btn btn-primary">Add Car</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
