<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Cars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container mt-4">
    <p th:if="${start != null and end != null}"
       th:text="'Available cars from ' + ${start} + ' to ' + ${end}"></p>

    <!-- Filters -->
    <div class="card mb-4">
        <div class="card-header">
            <button class="btn btn-link p-0 text-decoration-none"
                    type="button" data-bs-toggle="collapse" data-bs-target="#filtersCollapse">
                Filters
            </button>
        </div>
        <div class="collapse show" id="filtersCollapse">
            <div class="card-body">
                <form method="GET" th:action="@{/cars/carsAvailableToRent}">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <!-- Body Types -->
                            <div class="mb-4">
                                <label for="bodyTypes" class="form-label fw-bold">Body Types</label>
                                <select name="bodyTypes" id="bodyTypes" class="form-select" multiple size="5"
                                        style="height: 160px;">
                                    <option th:each="bodyType : ${allBodyTypes}"
                                            th:value="${bodyType.name}"
                                            th:text="${bodyType.name + ' (' + bodyType.numberOfSeats + ' seats)'}"
                                            th:selected="${filters != null && filters.bodyTypes != null && #lists.contains(filters.bodyTypes, bodyType)}">
                                    </option>
                                </select>
                                <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
                            </div>
                            <!-- Categories -->
                            <div class="mb-4">
                                <label for="categories" class="form-label fw-bold">Category</label>
                                <select name="categories" id="categories" class="form-select" multiple size="5"
                                        style="height: 160px;">
                                    <option th:each="category : ${categories}"
                                            th:value="${category.categoryName}"
                                            th:text="${category.categoryName + ' : ' + category.categoryDescription}"
                                            th:selected="${filters != null && filters.categories != null && #lists.contains(filters.categories, category)}">
                                    </option>
                                </select>
                                <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <!-- Brands -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Brands</label>
                                <div class="border rounded p-3" style="max-height: 160px; overflow-y: auto;">
                                    <div th:each="brand : ${allBrands}" class="form-check">
                                        <input class="form-check-input" type="checkbox" name="brands"
                                               th:value="${brand}" th:id="'brand-' + ${brand}"
                                               th:checked="${filters != null && filters.brands != null && #lists.contains(filters.brands, brand)}">
                                        <label class="form-check-label" th:for="'brand-' + ${brand}" th:text="${brand}"></label>
                                    </div>
                                </div>
                            </div>
                            <!-- Transmission -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Transmission</label>
                                <div class="border rounded p-3" style="max-height: 120px; overflow-y: auto;">
                                    <div th:each="transmission : ${allTransmissions}" class="form-check">
                                        <input class="form-check-input" type="checkbox" name="transmissions"
                                               th:value="${transmission}" th:id="'trans-' + ${transmission}"
                                               th:checked="${filters != null && filters.transmissionType != null && #lists.contains(filters.transmissionType, transmission)}">
                                        <label class="form-check-label" th:for="'trans-' + ${transmission}" th:text="${transmission}"></label>
                                    </div>
                                </div>
                            </div>
                            <!-- Traction -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Traction</label>
                                <div class="border rounded p-3">
                                    <div th:each="traction : ${allTractionTypes}" class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="tractions"
                                               th:value="${traction}" th:id="'traction-' + ${traction}"
                                               th:checked="${filters != null && filters.tractions != null && #lists.contains(filters.tractions, traction)}">
                                        <label class="form-check-label" th:for="'traction-' + ${traction}" th:text="${traction}"></label>
                                    </div>
                                </div>
                            </div>
                            <!-- Year Range -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Year Range</label>
                                <div class="row">
                                    <div class="col">
                                        <input type="number" name="firstYear" class="form-control"
                                               placeholder="From" min="1886" max="2030"
                                               th:value="${filters != null ? filters.firstYear : ''}">
                                    </div>
                                    <div class="col">
                                        <input type="number" name="lastYear" class="form-control"
                                               placeholder="To" min="1886" max="2030"
                                               th:value="${filters != null ? filters.lastYear : ''}">
                                    </div>
                                </div>
                            </div>
                            <!-- Dates -->
                            <div class="mb-2">
                                <label class="form-label fw-bold">Select New Dates</label>
                                <input type="date" name="start" th:value="${start}" class="form-control mb-2"/>
                                <input type="date" name="end" th:value="${end}" class="form-control"/>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-primary">Apply Filters</button>
                            <a th:href="@{/cars/carsAvailableToRent(start=${start}, end=${end})}"
                               class="btn btn-outline-secondary">Clear All</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Cars table -->
    <div th:if="${cars.size() == 0}">
        <div class="alert alert-info">No available cars with the selected filters.</div>
    </div>

    <div th:if="${cars.size() != 0}" class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-primary">
            <tr>
                <th>Brand</th>
                <th>Model</th>
                <th>Year</th>
                <th>Seats</th>
                <th>License Plate</th>
                <th>Engine</th>
                <th>Body</th>
                <th>Transmission</th>
                <th>Traction</th>
                <th>Category</th>
                <th>Price/Day</th>
                <th>Status</th>
                <th>Image</th>
                <th>Rent</th>
                <th sec:authorize="hasAnyAuthority('EMPLOYEE','MANAGER')">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="car : ${cars}">
                <td th:text="${car.carModel.brand}"></td>
                <td th:text="${car.carModel.model}"></td>
                <td th:text="${car.carModel.year}"></td>
                <td th:text="${car.carModel.carBody.numberOfSeats}"></td>
                <td th:text="${car.licencePlate}"></td>
                <td th:text="${car.carModel.engine}"></td>
                <td th:text="${car.carModel.carBody.name}"></td>
                <td th:text="${car.carModel.transmission.transmissionName}"></td>
                <td th:text="${car.carModel.traction}"></td>
                <td th:text="${car.carModel.category.categoryName}"></td>
                <td th:text="${car.carModel.pricePerDay + ' RON'}"></td>
                <td>
                    <span th:text="${car.status}"
                          th:class="${car.status == 'AVAILABLE'} ? 'badge bg-success' :
                                    (${car.status == 'RENTED'} ? 'badge bg-warning text-dark' : 'badge bg-danger')">
                    </span>
                </td>
                <td>
                    <img th:if="${car.image != null}" th:src="@{${car.image}}" alt="Car image"
                         style="width: 80px; height: 60px; object-fit: cover;">
                    <span th:if="${car.image == null}" class="text-muted">No image</span>
                </td>
                <td>
                    <form action="#" th:action="@{/rentals/newRental}" method="GET">
                        <input type="hidden" name="start" th:value="${start}">
                        <input type="hidden" name="end" th:value="${end}">
                        <input type="hidden" name="carId" th:value="${car.carId}">
                        <button type="submit" class="btn btn-sm btn-primary"
                                th:disabled="${car.status != 'AVAILABLE'}">RENT</button>
                    </form>
                </td>
                <td sec:authorize="hasAnyAuthority('EMPLOYEE','MANAGER')"
                    th:if="${companyId == car.carRentalCompany.carRentalCompanyId}">
                    <div class="d-flex flex-column gap-1">
                        <form action="#" th:action="@{/employee/cars/updateCar}" method="GET">
                            <input type="hidden" name="carId" th:value="${car.carId}">
                            <button type="submit" class="btn btn-sm btn-outline-primary w-100">Update</button>
                        </form>
                        <form action="#" th:action="@{/employee/cars/deleteCar}" method="POST">
                            <input type="hidden" name="carId" th:value="${car.carId}">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100"
                                    onclick="return confirm('Are you sure you want to delete this car?')">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Back Home</a>
        <a sec:authorize="hasAnyAuthority('EMPLOYEE','MANAGER')"
           th:href="@{/employee/addCarsForm}" class="btn btn-primary">Add Car</a>
    </div>
</div>
</body>
</html>
