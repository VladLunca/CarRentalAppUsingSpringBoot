<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

  <title>Add Category</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>
<div class="container">
  <div id="loginbox" style="margin-top: 50px;" class="col-md-3 col-md-offset-2 col-sm-6 col-sm-offset-2">
    <div class="card border-info">
      <div class="card-header bg-info">
        <h3>Add Category</h3>
      </div>
      <div class="card-body">
        <div class="card-text">
          <form action="#" th:action="@{/employee/proccesCategoryForm}"
                th:object="${category}"
                method="POST" class="form-horizontal">
            <div class="mb-3">
              <label for="categoryName" class="form-label">Category Name *</label>
              <input id="categoryName"
                     type="text"
                     th:field="*{categoryName}"
                     placeholder="Enter Category name"
                     class="form-control"
                     required/>
            </div>
            <div class="mb-3">
              <label for="desc" class="form-label">Category Description *</label>
              <input id="desc"
                     type="text"
                     th:field="*{categoryDescription}"
                     placeholder="Enter category description"
                     class="form-control"
                     required/>
            </div>
            <div class="d-flex justify-content-between mt-4">
              <a th:href="@{/employee/addCarsForm}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Add Cars
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add Category
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
