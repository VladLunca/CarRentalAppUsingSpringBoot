<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Category</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container" style="margin-top: 50px;">
    <div class="row g-4">

        <!-- Form -->
        <div class="col-md-4">
            <div class="card border-info h-100">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">Add Category</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/employee/proccesCategoryForm}" th:object="${category}" method="POST">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">Category Name *</label>
                            <input id="categoryName" type="text" th:field="*{categoryName}"
                                   placeholder="e.g. Economy" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="categoryDescription" class="form-label">Description *</label>
                            <input id="categoryDescription" type="text" th:field="*{categoryDescription}"
                                   placeholder="e.g. Budget-friendly cars" class="form-control" required/>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/employee/addCarModelForm}" class="btn btn-secondary">Back to Car Model</a>
                            <button type="submit" class="btn btn-primary">Add Category</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Existing categories table -->
        <div class="col-md-8">
            <div class="card border-info h-100">
                <div class="card-header bg-info text-white">Existing Categories</div>
                <div class="card-body p-0">
                    <div th:if="${warning}" class="alert alert-warning m-3" th:text="${warning}"></div>
                    <div th:if="${#lists.isEmpty(categories)}" class="p-3 text-muted">No categories added yet.</div>
                    <table th:if="${!#lists.isEmpty(categories)}" class="table table-sm table-striped mb-0">
                        <thead class="table-info">
                            <tr><th>Name</th><th>Description</th><th></th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td th:text="${cat.categoryName}"></td>
                                <td th:text="${cat.categoryDescription}"></td>
                                <td>
                                    <form th:action="@{/employee/deleteCategory}" method="POST">
                                        <input type="hidden" name="categoryId" th:value="${cat.id}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Delete this category?')">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
