<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>
<div class="container" style="margin-top: 50px;">
  <div class="row g-4">

    <!-- Form -->
    <div class="col-md-4">
      <div class="card border-info h-100">
        <div class="card-header bg-info text-white">
          <h5 class="mb-0">Add Engine</h5>
        </div>
        <div class="card-body">
          <form th:action="@{/employee/processEngineForm}" th:object="${engine}" method="POST">
            <div class="mb-3">
              <label for="horsePower" class="form-label">Horse Power *</label>
              <input id="horsePower" type="number" th:field="*{horsePower}" placeholder="e.g. 150" min="20"
                     class="form-control" required/>
            </div>
            <div class="mb-3">
              <label for="engineCapacity" class="form-label">Capacity (cc) *</label>
              <input id="engineCapacity" type="number" th:field="*{engineCapacity}" placeholder="e.g. 1600" min="0"
                     class="form-control" required/>
            </div>
            <div class="mb-3">
              <label for="engineType" class="form-label">Engine Type *</label>
              <select id="engineType" th:field="*{engineType}" class="form-control" required>
                <option value="">Select Engine Type</option>
                <option th:each="type : ${engineTypes}" th:value="${type}" th:text="${type}"></option>
              </select>
            </div>
            <div class="d-flex justify-content-between mt-4">
              <a th:href="@{/employee/addCarModelForm}" class="btn btn-secondary">Back to Car Model</a>
              <button type="submit" class="btn btn-primary">Add Engine</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Existing engines table -->
    <div class="col-md-8">
      <div class="card border-info h-100">
        <div class="card-header bg-info text-white">Existing Engines</div>
        <div class="card-body p-0">
          <div th:if="${warning}" class="alert alert-warning m-3" th:text="${warning}"></div>
          <div th:if="${#lists.isEmpty(engines)}" class="p-3 text-muted">No engines added yet.</div>
          <table th:if="${!#lists.isEmpty(engines)}" class="table table-sm table-striped mb-0">
            <thead class="table-info">
              <tr><th>HP</th><th>Capacity (cc)</th><th>Type</th><th></th></tr>
            </thead>
            <tbody>
              <tr th:each="e : ${engines}">
                <td th:text="${e.horsePower}"></td>
                <td th:text="${e.engineCapacity}"></td>
                <td th:text="${e.engineType}"></td>
                <td>
                  <form th:action="@{/employee/deleteEngine}" method="POST">
                    <input type="hidden" name="engineId" th:value="${e.engineId}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Delete this engine?')">Delete</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
