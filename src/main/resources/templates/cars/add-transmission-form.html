<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Transmission</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container">
    <div style="margin-top: 50px;" class="col-md-3 col-md-offset-2 col-sm-6 col-sm-offset-2">
        <div class="card border-info">
            <div class="card-header bg-info text-white">
                <h3>Add Transmission</h3>
            </div>
            <div class="card-body">
                <form action="#" th:action="@{/employee/processTransmissionForm}"
                      th:object="${transmission}"
                      method="POST">
                    <div class="mb-3">
                        <label for="transmissionName" class="form-label">Transmission Name *</label>
                        <input id="transmissionName" type="text" th:field="*{transmissionName}"
                               placeholder="e.g. 6-speed manual" class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label for="transmissionType" class="form-label">Transmission Type *</label>
                        <select id="transmissionType" th:field="*{transmissionType}" class="form-control" required>
                            <option value="">Select Transmission Type</option>
                            <option th:each="type : ${transmissionTypes}"
                                    th:value="${type}"
                                    th:text="${type}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="numberOfGears" class="form-label">Number of Gears *</label>
                        <input id="numberOfGears" type="number" th:field="*{numberOfGears}"
                               placeholder="e.g. 6" min="1" class="form-control" required/>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/employee/addCarsForm}" class="btn btn-secondary">Back to Add Car</a>
                        <button type="submit" class="btn btn-primary">Add Transmission</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
