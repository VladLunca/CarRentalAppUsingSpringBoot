<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Car</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container">
    <div style="margin-top: 50px;" class="col-md-3 col-md-offset-2 col-sm-6 col-sm-offset-2">
        <div class="card border-info">
            <div class="card-header bg-info text-white">
                <h4>Update Car</h4>
                <small th:text="${car.carModelBrand + ' ' + car.carModelModel + ' (' + car.carModelYear + ')'}"></small>
            </div>
            <div class="card-body">
                <form action="#" th:action="@{/employee/processUpdateCarsForm}"
                      th:object="${car}"
                      enctype="multipart/form-data"
                      method="POST">
                    <input type="hidden" name="_method" value="put"/>
                    <input type="hidden" th:field="*{carId}"/>

                    <div class="mb-3">
                        <label for="licencePlate" class="form-label">License Plate *</label>
                        <input id="licencePlate" type="text" th:field="*{licencePlate}"
                               placeholder="License Plate" maxlength="7"
                               class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label for="color" class="form-label">Color *</label>
                        <input id="color" type="text" th:field="*{color}"
                               placeholder="Color" class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label for="mileage" class="form-label">Mileage (km) *</label>
                        <input id="mileage" type="number" th:field="*{mileage}"
                               placeholder="Mileage" min="0" class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">Status *</label>
                        <select id="status" th:field="*{status}" class="form-control" required>
                            <option value="AVAILABLE">Available</option>
                            <option value="RENTED">Rented</option>
                            <option value="IN_SERVICE">In Service</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="imageFile" class="form-label">Car Image</label>
                        <input id="imageFile" name="imageFile" type="file"
                               accept="image/jpeg,image/png" class="form-control"/>
                        <small class="text-muted">Leave empty to keep current image</small>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/cars/showCars}" class="btn btn-secondary">Back to Cars</a>
                        <button type="submit" class="btn btn-primary">Update Car</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
