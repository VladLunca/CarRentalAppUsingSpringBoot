<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Car Model</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6" style="margin-top: 50px;">
            <div class="card border-info">
                <div class="card-header bg-info text-white">
                    <h4>Add Car Model</h4>
                </div>
                <div class="card-body">
                    <form action="#" th:action="@{/employee/processCarModelForm}"
                          th:object="${carModel}"
                          method="POST">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="brand" class="form-label">Brand *</label>
                                <input type="text" id="brand" th:field="*{brand}"
                                       placeholder="e.g. Opel" class="form-control" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="model" class="form-label">Model *</label>
                                <input type="text" id="model" th:field="*{model}"
                                       placeholder="e.g. Astra" class="form-control" required/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="year" class="form-label">Fabrication Year *</label>
                                <input type="number" id="year" th:field="*{year}"
                                       placeholder="e.g. 2022" min="1886" max="2030"
                                       class="form-control" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="pricePerDay" class="form-label">Price per Day (RON) *</label>
                                <input type="number" id="pricePerDay" th:field="*{pricePerDay}"
                                       placeholder="e.g. 150" min="1"
                                       class="form-control" required/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="engine" class="form-label">Engine *</label>
                                <div class="d-flex gap-2">
                                    <select id="engine" th:field="*{engineId}" class="form-control" required>
                                        <option value="">Select Engine</option>
                                        <option th:each="engine : ${engines}"
                                                th:value="${engine.engineId}"
                                                th:text="${engine}"></option>
                                    </select>
                                    <a th:href="@{/employee/addEngine}"
                                       class="btn btn-outline-primary btn-sm" title="Add New Engine">+</a>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="transmission" class="form-label">Transmission *</label>
                                <div class="d-flex gap-2">
                                    <select id="transmission" th:field="*{transmissionId}" class="form-control" required>
                                        <option value="">Select Transmission</option>
                                        <option th:each="transmission : ${transmissions}"
                                                th:value="${transmission.transmissionId}"
                                                th:text="${transmission.transmissionName}"></option>
                                    </select>
                                    <a th:href="@{/employee/addTransmission}"
                                       class="btn btn-outline-primary btn-sm" title="Add New Transmission">+</a>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="carBody" class="form-label">Car Body *</label>
                                <div class="d-flex gap-2">
                                    <select id="carBody" th:field="*{carBodyId}" class="form-control" required>
                                        <option value="">Select Car Body</option>
                                        <option th:each="carBody : ${carBodies}"
                                                th:value="${carBody.id}"
                                                th:text="${carBody.name + ' (' + carBody.numberOfSeats + ' seats)'}"></option>
                                    </select>
                                    <a th:href="@{/employee/addCarBody}"
                                       class="btn btn-outline-primary btn-sm" title="Add New Car Body">+</a>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">Car Category *</label>
                                <div class="d-flex gap-2">
                                    <select id="category" th:field="*{categoryId}" class="form-control" required>
                                        <option value="">Select Category</option>
                                        <option th:each="category : ${categories}"
                                                th:value="${category.id}"
                                                th:text="${category.categoryName}"></option>
                                    </select>
                                    <a th:href="@{/employee/addCategory}"
                                       class="btn btn-outline-primary btn-sm" title="Add New Category">+</a>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="traction" class="form-label">Traction *</label>
                                <select id="traction" th:field="*{traction}" class="form-control" required>
                                    <option value="">Select Traction</option>
                                    <option th:each="t : ${tractionTypes}"
                                            th:value="${t}" th:text="${t}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="fuelConsumption" class="form-label">Fuel Consumption (L/100km) *</label>
                                <input type="number" id="fuelConsumption" th:field="*{fuelConsumption}"
                                       placeholder="e.g. 6.5" min="0" step="0.1"
                                       class="form-control" required/>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="numberOfLuggage" class="form-label">Number of Luggage *</label>
                                <input type="number" id="numberOfLuggage" th:field="*{numberOfLuggage}"
                                       placeholder="e.g. 2" min="0"
                                       class="form-control" required/>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/cars/showCars}" class="btn btn-secondary">Back to Cars</a>
                            <button type="submit" class="btn btn-primary">Add Car Model</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Existing car models -->
            <div class="card mt-3 border-info">
                <div class="card-header bg-info text-white">Existing Car Models</div>
                <div class="card-body p-0">
                    <div th:if="${warning}" class="alert alert-warning m-3" th:text="${warning}"></div>
                    <div th:if="${#lists.isEmpty(carModels)}" class="p-3 text-muted">No car models added yet.</div>
                    <table th:if="${!#lists.isEmpty(carModels)}" class="table table-sm table-striped mb-0">
                        <thead class="table-info">
                            <tr><th>Brand</th><th>Model</th><th>Year</th><th>Price/Day</th><th></th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="cm : ${carModels}">
                                <td th:text="${cm.brand}"></td>
                                <td th:text="${cm.model}"></td>
                                <td th:text="${cm.year}"></td>
                                <td th:text="${cm.pricePerDay + ' RON'}"></td>
                                <td>
                                    <form th:action="@{/employee/deleteCarModel}" method="POST">
                                        <input type="hidden" name="carModelId" th:value="${cm.carModelId}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Delete this car model?')">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
