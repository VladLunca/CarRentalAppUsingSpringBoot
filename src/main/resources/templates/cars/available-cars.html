<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Available Cars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">&#128665; Available Cars
                <small class="fs-6 fw-normal" th:if="${start != null and end != null}"
                       th:text="'from ' + ${start} + ' to ' + ${end}"></small>
            </h4>
        </div>
        <div class="card-body">

            <!-- Filters -->
            <div class="card mb-4">
                <div class="card-header">
                    <button class="btn btn-link p-0 text-decoration-none" type="button"
                            data-bs-toggle="collapse" data-bs-target="#filtersCollapse">
                        Filters
                    </button>
                </div>
                <div class="collapse show" id="filtersCollapse">
                    <div class="card-body">
                        <form method="GET" th:action="@{/cars/carsAvailableToRent}">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Body Types</label>
                                        <select name="bodyTypes" class="form-select" multiple style="height: 130px;">
                                            <option th:each="bodyType : ${allBodyTypes}"
                                                    th:value="${bodyType}"
                                                    th:text="${bodyType}"
                                                    th:selected="${filters != null and filters.bodyTypes != null and #lists.contains(filters.bodyTypes, bodyType)}">
                                            </option>
                                        </select>
                                        <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Category</label>
                                        <select name="categories" class="form-select" multiple style="height: 130px;">
                                            <option th:each="category : ${categories}"
                                                    th:value="${category.categoryName}"
                                                    th:text="${category.categoryName}"
                                                    th:selected="${filters != null and filters.categories != null and #lists.contains(filters.categories, category.categoryName)}">
                                            </option>
                                        </select>
                                        <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Brands</label>
                                        <div class="border rounded p-3" style="max-height: 130px; overflow-y: auto;">
                                            <div th:each="brand : ${allBrands}" class="form-check">
                                                <input class="form-check-input" type="checkbox" name="brands"
                                                       th:value="${brand}" th:id="'brand-' + ${brand}"
                                                       th:checked="${filters != null and filters.brands != null and #lists.contains(filters.brands, brand)}">
                                                <label class="form-check-label" th:for="'brand-' + ${brand}" th:text="${brand}"></label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Transmission</label>
                                        <div class="border rounded p-3" style="max-height: 100px; overflow-y: auto;">
                                            <div th:each="transmission : ${allTransmissions}" class="form-check">
                                                <input class="form-check-input" type="checkbox" name="transmissions"
                                                       th:value="${transmission}" th:id="'trans-' + ${transmission}"
                                                       th:checked="${filters != null and filters.transmissions != null and #lists.contains(filters.transmissions, transmission)}">
                                                <label class="form-check-label" th:for="'trans-' + ${transmission}" th:text="${transmission}"></label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Traction</label>
                                        <div class="border rounded p-3">
                                            <div th:each="traction : ${allTractionTypes}" class="form-check form-check-inline">
                                                <input class="form-check-input" type="checkbox" name="tractions"
                                                       th:value="${traction}" th:id="'traction-' + ${traction}"
                                                       th:checked="${filters != null and filters.tractions != null and #lists.contains(filters.tractions, traction)}">
                                                <label class="form-check-label" th:for="'traction-' + ${traction}" th:text="${traction}"></label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Year Range</label>
                                        <div class="row">
                                            <div class="col">
                                                <input type="number" name="firstYear" class="form-control"
                                                       placeholder="From" min="1886" max="2030"
                                                       th:value="${filters != null ? filters.firstYear : ''}">
                                            </div>
                                            <div class="col">
                                                <input type="number" name="lastYear" class="form-control"
                                                       placeholder="To" min="1886" max="2030"
                                                       th:value="${filters != null ? filters.lastYear : ''}">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label fw-bold">Change Dates</label>
                                        <input type="date" name="start" th:value="${start}" class="form-control mb-2"/>
                                        <input type="date" name="end" th:value="${end}" class="form-control"/>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex justify-content-center gap-2 mt-2">
                                <button type="submit" class="btn btn-success">Apply Filters</button>
                                <a th:href="@{/cars/carsAvailableToRent(start=${start}, end=${end})}"
                                   class="btn btn-outline-secondary">Clear Filters</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Cars table -->
            <div th:if="${#lists.isEmpty(cars)}" class="alert alert-info">
                No available cars with the selected filters.
            </div>

            <div th:if="${!#lists.isEmpty(cars)}" class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-success">
                    <tr>
                        <th>Brand</th>
                        <th>Model</th>
                        <th>Year</th>
                        <th>Seats</th>
                        <th>Engine</th>
                        <th>Transmission</th>
                        <th>Traction</th>
                        <th>Category</th>
                        <th>Price/Day</th>
                        <th>Image</th>
                        <th>Rent</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="car : ${cars}">
                        <td th:text="${car.brand}"></td>
                        <td th:text="${car.model}"></td>
                        <td th:text="${car.year}"></td>
                        <td th:text="${car.numberOfSeats}"></td>
                        <td th:text="${car.horsePower + 'hp ' + car.engineType}"></td>
                        <td th:text="${car.transmissionName}"></td>
                        <td th:text="${car.traction}"></td>
                        <td th:text="${car.categoryName}"></td>
                        <td th:text="${car.pricePerDay + ' RON'}"></td>
                        <td>
                            <img th:if="${car.image != null}" th:src="@{${car.image}}" alt="Car image"
                                 style="width: 80px; height: 60px; object-fit: cover;">
                            <span th:if="${car.image == null}" class="text-muted">No image</span>
                        </td>
                        <td>
                            <form th:action="@{/rentals/newRental}" method="GET">
                                <input type="hidden" name="carId" th:value="${car.id}">
                                <input type="hidden" name="start" th:value="${start}">
                                <input type="hidden" name="end" th:value="${end}">
                                <button type="submit" class="btn btn-sm btn-success">Rent</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-3">
                <a th:href="@{/home}" class="btn btn-secondary">Back Home</a>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I"
        crossorigin="anonymous"></script>
</body>
</html>
