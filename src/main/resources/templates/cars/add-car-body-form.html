<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Car Body</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container" style="margin-top: 50px;">
    <div class="row g-4">

        <!-- Form -->
        <div class="col-md-4">
            <div class="card border-info h-100">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">Add Car Body</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/employee/processCarBodyForm}" th:object="${carBody}" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Body Type *</label>
                            <select id="name" th:field="*{name}" class="form-control" required>
                                <option value="">Select Body Type</option>
                                <option th:each="type : ${carBodyTypes}" th:value="${type}" th:text="${type}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="numberOfSeats" class="form-label">Number of Seats *</label>
                            <input id="numberOfSeats" type="number" th:field="*{numberOfSeats}"
                                   placeholder="e.g. 5" min="2" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="numberOfDoors" class="form-label">Number of Doors *</label>
                            <input id="numberOfDoors" type="number" th:field="*{numberOfDoors}"
                                   placeholder="e.g. 4" min="2" class="form-control" required/>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/employee/addCarModelForm}" class="btn btn-secondary">Back to Car Model</a>
                            <button type="submit" class="btn btn-primary">Add Car Body</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Existing car bodies table -->
        <div class="col-md-8">
            <div class="card border-info h-100">
                <div class="card-header bg-info text-white">Existing Car Bodies</div>
                <div class="card-body p-0">
                    <div th:if="${warning}" class="alert alert-warning m-3" th:text="${warning}"></div>
                    <div th:if="${#lists.isEmpty(carBodies)}" class="p-3 text-muted">No car bodies added yet.</div>
                    <table th:if="${!#lists.isEmpty(carBodies)}" class="table table-sm table-striped mb-0">
                        <thead class="table-info">
                            <tr><th>Type</th><th>Seats</th><th>Doors</th><th></th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="cb : ${carBodies}">
                                <td th:text="${cb.name}"></td>
                                <td th:text="${cb.numberOfSeats}"></td>
                                <td th:text="${cb.numberOfDoors}"></td>
                                <td>
                                    <form th:action="@{/employee/deleteCarBody}" method="POST">
                                        <input type="hidden" name="carBodyId" th:value="${cb.id}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Delete this car body?')">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
