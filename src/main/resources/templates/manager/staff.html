<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Staff - Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0">&#128101; Manage Staff</h4>
        </div>
        <div class="card-body">

            <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
                <strong>Warning:</strong> <span th:text="${warning}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <h5 class="mt-2">Current Employees</h5>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-warning">
                    <tr>
                        <th>Username</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Phone Number</th>
                        <th>Email</th>
                        <th>Remove</th>
                    </tr>
                    </thead>
                    <tbody th:each="user : ${employees}">
                    <tr>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.phoneNumber}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <form th:action="@{/manager/staff/remove-employee}" method="post">
                                <input type="hidden" name="userId" th:value="${user.id}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Remove this employee from the company?')">
                                    Remove
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="6" class="text-center text-muted">No employees yet.</td>
                    </tr>
                </table>
            </div>

            <h5 class="mt-4">Add Employee</h5>
            <form th:action="@{/manager/staff}" method="get" class="mb-3">
                <div class="input-group">
                    <input type="text" name="query" class="form-control"
                           placeholder="Search by username..." th:value="${query}"/>
                    <button type="submit" class="btn btn-warning">Search</button>
                </div>
            </form>

            <div th:if="${searchResults != null and !#lists.isEmpty(searchResults)}" class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-warning">
                    <tr>
                        <th>Username</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Phone Number</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody th:each="user : ${searchResults}">
                    <tr>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.phoneNumber}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <form th:if="${user.role.name() == 'CUSTOMER'}"
                                  th:action="@{/manager/staff/add-employee}" method="post">
                                <input type="hidden" name="userId" th:value="${user.id}"/>
                                <button type="submit" class="btn btn-sm btn-success">Add</button>
                            </form>
                            <span th:if="${user.role.name() == 'EMPLOYEE'}"
                                  class="badge bg-secondary">Already employee</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${query != null and !query.isEmpty() and (searchResults == null or #lists.isEmpty(searchResults))}"
               class="text-muted">No users found.</p>

            <a th:href="@{/home}" class="btn btn-warning mt-3">Back Home</a>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I"
        crossorigin="anonymous"></script>
</body>
</html>
