<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

  <title>Add a Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>
<div class="container">
  <div id="loginbox" style="margin-top: 50px;" class="col-md-3 col-md-offset-2 col-sm-6 col-sm-offset-2">
    <div class="card border-info">
      <div class="card-header bg-info">
      <h3>Add Engine</h3>
    </div>
      <div class="card-body">

        <div class="card-text">
          <form action="#" th:action="@{/employee/processEngineForm}"
                th:object="${engine}"
                method="POST" class="form-horizontal">
            <div class="mb-3">
              <label for="horsePower" class="form-label">Horse Power *</label>
              <input id="horsePower" type="number" th:field="*{horsePower}" placeholder="Horse Power (*)" min="20"
                       class="form-control" required/>
            </div>
            <div class="mb-3">
              <label for="capacity" class="form-label">Capacity*</label>
              <input id="capacity" type="number" th:field="*{capacity}" placeholder="Capacity (*)" min="0" required
                       class="form-control" step="any"/>
            </div>
            <div class="mb-3">
              <label for="engineType" class="form-label">Engine Type *</label>
                <select id="engineType" th:field="*{engineType}" class="form-control" required>
                  <option value="">Select Car Engine Type</option>
                  <option th:each="type : ${engineTypes}"
                          th:value="${type}"
                          th:text="${type}"></option>
                </select>
            </div>
            <div class="d-flex justify-content-between mt-4">
              <a th:href="@{/employee/addCarsForm}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Add Cars
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add Engine
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
