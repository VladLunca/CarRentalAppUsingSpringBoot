<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Company</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container">
    <div style="margin-top: 50px;" class="col-md-3 col-md-offset-2 col-sm-6 col-sm-offset-2">
        <div class="card border-info">
            <div class="card-header bg-info text-white">
                <h4>Update Company</h4>
            </div>
            <div class="card-body">
                <form action="#" th:action="@{/manager/rentalsCompanies/processUpdateCompany}"
                      th:object="${company}"
                      method="POST">
                    <input type="hidden" name="_method" value="put"/>
                    <input type="hidden" th:field="*{carRentalCompanyId}"/>

                    <div class="mb-3">
                        <label class="form-label">Company Name *</label>
                        <input type="text" th:field="*{carRentalCompanyName}"
                               class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" th:field="*{email}"
                               class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="text" th:field="*{phoneNumber}"
                               class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" th:field="*{description}"
                               class="form-control"/>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <label class="form-label">City *</label>
                        <input type="text" th:field="*{address.cityName}"
                               class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Street *</label>
                        <input type="text" th:field="*{address.streetName}"
                               class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Street Number *</label>
                        <input type="number" th:field="*{address.streetNumber}"
                               min="1" class="form-control" required/>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/manager/rentalsCompanies/showCompany}" class="btn btn-secondary">Back to Companies</a>
                        <button type="submit" class="btn btn-primary">Update Company</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
