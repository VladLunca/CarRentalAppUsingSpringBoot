<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Rental</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container" style="margin-top: 50px;">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-success">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Confirm Rental</h4>
                    <small th:text="${carDescription}"></small><br/>
                    <small th:text="'From ' + ${startDate} + ' to ' + ${endDate} + ' — ' + ${totalPrice} + ' RON total'"></small>
                </div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/rentals/processRentalForm}" th:object="${rentalForm}" method="POST">
                        <input type="hidden" th:field="*{carId}"/>
                        <input type="hidden" th:field="*{startDate}"/>
                        <input type="hidden" th:field="*{endDate}"/>

                        <!-- Options -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input id="withDriver" type="checkbox" th:field="*{withDriver}" class="form-check-input"/>
                                    <label for="withDriver" class="form-check-label">Include Driver</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input id="childSeat" type="checkbox" th:field="*{childSeat}" class="form-check-input"/>
                                    <label for="childSeat" class="form-check-label">Child Seat</label>
                                </div>
                            </div>
                        </div>

                        <!-- Pickup -->
                        <h5>Pickup Location</h5>
                        <div class="row">
                            <div class="col-md-5 mb-3">
                                <label for="pickupCity" class="form-label">City *</label>
                                <input id="pickupCity" type="text" th:field="*{pickupCity}"
                                       placeholder="City" class="form-control" required/>
                            </div>
                            <div class="col-md-5 mb-3">
                                <label for="pickupStreet" class="form-label">Street *</label>
                                <input id="pickupStreet" type="text" th:field="*{pickupStreet}"
                                       placeholder="Street" class="form-control" required/>
                            </div>
                            <div class="col-md-2 mb-3">
                                <label for="pickupStreetNumber" class="form-label">No. *</label>
                                <input id="pickupStreetNumber" type="number" th:field="*{pickupStreetNumber}"
                                       placeholder="1" min="1" class="form-control" required/>
                            </div>
                        </div>

                        <!-- Dropoff -->
                        <h5>Dropoff Location</h5>
                        <div class="row">
                            <div class="col-md-5 mb-3">
                                <label for="dropoffCity" class="form-label">City *</label>
                                <input id="dropoffCity" type="text" th:field="*{dropoffCity}"
                                       placeholder="City" class="form-control" required/>
                            </div>
                            <div class="col-md-5 mb-3">
                                <label for="dropoffStreet" class="form-label">Street *</label>
                                <input id="dropoffStreet" type="text" th:field="*{dropoffStreet}"
                                       placeholder="Street" class="form-control" required/>
                            </div>
                            <div class="col-md-2 mb-3">
                                <label for="dropoffStreetNumber" class="form-label">No. *</label>
                                <input id="dropoffStreetNumber" type="number" th:field="*{dropoffStreetNumber}"
                                       placeholder="1" min="1" class="form-control" required/>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/cars/carsAvailableToRent(start=${startDate}, end=${endDate})}"
                               class="btn btn-secondary">Back to Cars</a>
                            <button type="submit" class="btn btn-success">Confirm Rental</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
