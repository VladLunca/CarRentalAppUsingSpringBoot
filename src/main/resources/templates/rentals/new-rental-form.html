<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Rental</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="shah384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6" style="margin-top: 50px;">
            <div class="card border-info">
                <div class="card-header bg-info text-white">
                    <h4>Rent a Car</h4>
                    <p th:text="${rentalLocationDto.rental.car.carModel.brand + ' ' + rentalLocationDto.rental.car.carModel.model}"></p>
                    <p th:text="'From ' + ${rentalLocationDto.rental.startDate} + ' to ' + ${rentalLocationDto.rental.endDate}"></p>
                    <p th:text="'Price: ' + ${price} + ' RON'"></p>
                </div>
                <div class="card-body">
                    <form action="#" th:action="@{/rentals/processRentalForm}"
                          th:object="${rentalLocationDto}"
                          method="POST">
                        <input type="hidden" th:field="*{rental.car}"/>
                        <input type="hidden" th:field="*{rental.startDate}"/>
                        <input type="hidden" th:field="*{rental.endDate}"/>
                        <input type="hidden" th:field="*{rental.rentalId}"/>
                        <input type="hidden" th:field="*{rental.user}"/>

                        <!-- Options -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input id="driver" type="checkbox" th:field="*{rental.withDriver}"
                                           class="form-check-input"/>
                                    <label for="driver" class="form-check-label">Include Driver</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input id="childSeat" type="checkbox" th:field="*{rental.childSeat}"
                                           class="form-check-input"/>
                                    <label for="childSeat" class="form-check-label">Child Seat</label>
                                </div>
                            </div>
                        </div>

                        <!-- Pickup location -->
                        <h5>Pickup Location</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startCity" class="form-label">City *</label>
                                <input type="text" id="startCity" th:field="*{startLocation.cityName}"
                                       placeholder="City" class="form-control" required/>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="startStreet" class="form-label">Street *</label>
                                <input type="text" id="startStreet" th:field="*{startLocation.streetName}"
                                       placeholder="Street" class="form-control" required/>
                            </div>
                            <div class="col-md-2 mb-3">
                                <label for="startStreetNumber" class="form-label">No. *</label>
                                <input type="number" id="startStreetNumber" th:field="*{startLocation.streetNumber}"
                                       placeholder="Nr" min="1" class="form-control" required/>
                            </div>
                        </div>

                        <!-- Dropoff location -->
                        <h5>Dropoff Location</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="endCity" class="form-label">City *</label>
                                <input type="text" id="endCity" th:field="*{endLocation.cityName}"
                                       placeholder="City" class="form-control" required/>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="endStreet" class="form-label">Street *</label>
                                <input type="text" id="endStreet" th:field="*{endLocation.streetName}"
                                       placeholder="Street" class="form-control" required/>
                            </div>
                            <div class="col-md-2 mb-3">
                                <label for="endStreetNumber" class="form-label">No. *</label>
                                <input type="number" id="endStreetNumber" th:field="*{endLocation.streetNumber}"
                                       placeholder="Nr" min="1" class="form-control" required/>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/cars/showCars}" class="btn btn-secondary">Back to Cars</a>
                            <button type="submit" class="btn btn-primary">Confirm Rental</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
