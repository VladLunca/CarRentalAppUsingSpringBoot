<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Rentals</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                <span th:if="${view == 'client'}">My Rentals</span>
                <span th:if="${view != 'client'}">All Rentals</span>
            </h4>
        </div>
        <div class="card-body">

            <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
                <span th:text="${warning}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filters -->
            <div class="card mb-4">
                <div class="card-header">
                    <button class="btn btn-link p-0 text-decoration-none" type="button"
                            data-bs-toggle="collapse" data-bs-target="#filtersCollapse">
                        Filters
                    </button>
                </div>
                <div class="collapse show" id="filtersCollapse">
                    <div class="card-body">
                        <form method="GET" th:action="@{/rentals/allRentals}">
                            <input type="hidden" name="view" th:value="${view}"/>
                            <div class="d-flex flex-wrap gap-3 align-items-center">
                                <div class="form-check">
                                    <input id="pending" type="checkbox" name="pendingRentals"
                                           th:checked="${pendingRentals}" class="form-check-input"/>
                                    <label for="pending" class="form-check-label fw-bold text-warning">Pending</label>
                                </div>
                                <div class="form-check">
                                    <input id="active" type="checkbox" name="activeRentals"
                                           th:checked="${activeRentals}" class="form-check-input"/>
                                    <label for="active" class="form-check-label fw-bold text-success">Active</label>
                                </div>
                                <div class="form-check">
                                    <input id="completed" type="checkbox" name="completedRentals"
                                           th:checked="${completedRentals}" class="form-check-input"/>
                                    <label for="completed" class="form-check-label fw-bold text-secondary">Completed</label>
                                </div>
                                <div class="form-check">
                                    <input id="cancelled" type="checkbox" name="cancelledRentals"
                                           th:checked="${cancelledRentals}" class="form-check-input"/>
                                    <label for="cancelled" class="form-check-label fw-bold text-danger">Cancelled</label>
                                </div>
                                <div class="form-check">
                                    <input id="driver" type="checkbox" name="driver"
                                           th:checked="${driver}" class="form-check-input"/>
                                    <label for="driver" class="form-check-label fw-bold">With Driver</label>
                                </div>
                                <button type="submit" class="btn btn-primary btn-sm">Apply</button>
                                <a th:href="@{/rentals/allRentals(view=${view})}" class="btn btn-outline-secondary btn-sm">Clear</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div th:if="${#lists.isEmpty(rentals)}" class="alert alert-info">No rentals found.</div>

            <div th:if="${!#lists.isEmpty(rentals)}" class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-primary">
                    <tr>
                        <th>Car</th>
                        <th sec:authorize="hasAnyRole('EMPLOYEE','MANAGER')">User</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Pickup</th>
                        <th>Dropoff</th>
                        <th>Driver</th>
                        <th>Child Seat</th>
                        <th>Status</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="rental : ${rentals}">
                        <td th:text="${rental.carDescription}"></td>
                        <td sec:authorize="hasAnyRole('EMPLOYEE','MANAGER')"
                            th:text="${rental.username}"></td>
                        <td th:text="${rental.startDate}"></td>
                        <td th:text="${rental.endDate}"></td>
                        <td th:text="${rental.pickupLocation}"></td>
                        <td th:text="${rental.dropoffLocation}"></td>
                        <td th:text="${rental.withDriver ? 'Yes' : 'No'}"></td>
                        <td th:text="${rental.childSeat ? 'Yes' : 'No'}"></td>
                        <td>
                            <span th:text="${rental.status}"
                                  th:class="${rental.status.name() == 'ACTIVE'} ? 'badge bg-success' :
                                            (${rental.status.name() == 'PENDING'} ? 'badge bg-warning text-dark' :
                                            (${rental.status.name() == 'CANCELLED'} ? 'badge bg-danger' : 'badge bg-secondary'))">
                            </span>
                        </td>
                        <td th:text="${rental.totalPrice + ' RON'}"></td>
                        <td>
                            <div class="d-flex flex-column gap-1">
                                <form th:if="${rental.status.name() == 'PENDING'}"
                                      th:action="@{/rentals/cancelRental}" method="POST">
                                    <input type="hidden" name="rentalId" th:value="${rental.id}"/>
                                    <input type="hidden" name="view" th:value="${view}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Cancel this rental?')">Cancel</button>
                                </form>
                                <form sec:authorize="hasAnyRole('EMPLOYEE','MANAGER')"
                                      th:if="${rental.status.name() == 'PENDING'}"
                                      th:action="@{/rentals/approveRental}" method="POST">
                                    <input type="hidden" name="rentalId" th:value="${rental.id}"/>
                                    <input type="hidden" name="view" th:value="${view}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-success">Approve</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <a th:href="@{/home}" class="btn btn-secondary mt-3">Back Home</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I"
        crossorigin="anonymous"></script>
</body>
</html>
