<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Page</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container">
    <div id="loginbox" style="margin-top: 50px;" class="col-md-3 col-md-offset-2 col-sm-6 col-sm-offset-2">
        <div class="card border-info">
            <div class="card-header bg-info text-white">
                <h4>Registration</h4>
            </div>
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${registrationError}" class="alert alert-danger" role="alert">
                <span th:text="${registrationError}"></span>
            </div>
            <div class="card-body">
                <div class="card-text">
                    <form action="#" th:action="@{/register/processRegistrationForm}"
                          th:object="${webUserDTO}"
                          method="POST" class="form-horizontal">
                        <!-- User name -->
                        <div style="margin-bottom: 25px;" class="input-group">
                            <input type="text" th:field="*{userName}" placeholder="Username (*)"
                                   class="form-control"/>
                        </div>
                        <div style="margin-bottom: 25px;" class="input-group">

                            <input type="text" th:field="*{firstName}" placeholder="First Name (*)"
                                   class="form-control"/>
                        </div>
                        <div style="margin-bottom: 25px;" class="input-group">
                            <input type="text" th:field="*{lastName}" placeholder="Last name (*)"
                                   class="form-control"/>
                        </div>
                        <div style="margin-bottom: 25px;" class="input-group">
                            <input type="password" th:field="*{password}" placeholder="Password (*)"
                                   class="form-control"/>
                        </div>
                        <div style="margin-bottom: 25px;" class="input-group">

                            <input type="text" th:field="*{cnp}" placeholder="National ID (CNP) (*)"
                                   class="form-control"/>
                        </div>
                        <div style="margin-bottom: 25px;" class="input-group">

                            <input type="text" th:field="*{phoneNumber}" placeholder="Phone Number (*)"
                                   class="form-control"/>
                        </div>
                        <div style="margin-bottom: 25px;" class="input-group">

                            <input type="email" th:field="*{email}" placeholder="Email (*)"
                                   class="form-control"/>
                        </div>
                        <!-- Registration Button -->
                        <div style="margin-top: 10px" class="form-group">
                            <div class="col-sm-6 controls">
                                <button type="submit" class="btn btn-primary">Register</button>
                            </div>
                        </div>
                    </form>
                    <div>
                        <a th:href="@{/showMyLoginPage}"
                           class="btn btn-secondary mt-3"
                           role="button"
                           aria-pressed="true">Back to Log in</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
