<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Rentals Page</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container mt-4">
    <h2>Rentals</h2>

    <div th:if="${message}" class="alert alert-danger" role="alert">
        <span th:text="${message}"></span>
    </div>

    <!-- Filters -->
    <div class="card mb-4">
        <div class="card-body">
            <form method="GET" th:action="@{/rentals/allRentals}">
                <input type="hidden" name="view" th:value="${view}">
                <div class="d-flex flex-wrap gap-3">
                    <div class="form-check">
                        <input id="pending" type="checkbox" name="pendingRentals"
                               th:checked="${pendingRentals}" class="form-check-input">
                        <label for="pending" class="form-check-label fw-bold">Pending</label>
                    </div>
                    <div class="form-check">
                        <input id="active" type="checkbox" name="activeRentals"
                               th:checked="${activeRentals}" class="form-check-input">
                        <label for="active" class="form-check-label fw-bold">Active</label>
                    </div>
                    <div class="form-check">
                        <input id="completed" type="checkbox" name="completedRentals"
                               th:checked="${completedRentals}" class="form-check-input">
                        <label for="completed" class="form-check-label fw-bold">Completed</label>
                    </div>
                    <div class="form-check">
                        <input id="cancelled" type="checkbox" name="cancelledRentals"
                               th:checked="${cancelledRentals}" class="form-check-input">
                        <label for="cancelled" class="form-check-label fw-bold">Cancelled</label>
                    </div>
                    <div class="form-check">
                        <input id="driver" type="checkbox" name="driver"
                               th:checked="${driver}" class="form-check-input">
                        <label for="driver" class="form-check-label fw-bold">With Driver</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Apply Filters</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-primary">
            <tr>
                <th>Car</th>
                <th sec:authorize="hasAnyAuthority('EMPLOYEE','MANAGER')">User</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Pickup Location</th>
                <th>Dropoff Location</th>
                <th>Driver</th>
                <th>Child Seat</th>
                <th>Status</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="rental : ${rentals}">
                <td th:text="${rental.car.carModel.brand + ' ' + rental.car.carModel.model}"></td>
                <td sec:authorize="hasAnyAuthority('EMPLOYEE','MANAGER')"
                    th:text="${rental.user.username}"></td>
                <td th:text="${#temporals.format(rental.startDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${#temporals.format(rental.endDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${rental.pickupLocation.address.cityName + ', '
                             + rental.pickupLocation.address.streetName + ' nr '
                             + rental.pickupLocation.address.streetNumber}"></td>
                <td th:text="${rental.dropoffLocation.address.cityName + ', '
                             + rental.dropoffLocation.address.streetName + ' nr '
                             + rental.dropoffLocation.address.streetNumber}"></td>
                <td th:text="${rental.withDriver ? 'Yes' : 'No'}"></td>
                <td th:text="${rental.childSeat ? 'Yes' : 'No'}"></td>
                <td>
                    <span th:text="${rental.status}"
                          th:class="${rental.status == 'ACTIVE'} ? 'badge bg-success' :
                                    (${rental.status == 'PENDING'} ? 'badge bg-warning text-dark' :
                                    (${rental.status == 'CANCELLED'} ? 'badge bg-danger' : 'badge bg-secondary'))">
                    </span>
                </td>
                <td th:text="${rental.car != null and rental.startDate != null and rental.endDate != null}
                             ? ${rental.numberOfDays() * rental.car.carModel.pricePerDay + ' RON'} : 'N/A'">
                </td>
                <td>
                    <form action="#" th:action="@{/rentals/cancelRental}" method="POST"
                          th:if="${rental.status == 'PENDING'}">
                        <input type="hidden" name="rentalId" th:value="${rental.rentalId}">
                        <input type="hidden" name="view" th:value="${view}">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Are you sure you want to cancel this rental?')">
                            Cancel
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/}" class="btn btn-secondary mt-3">Back Home</a>
</div>
</body>
</html>
