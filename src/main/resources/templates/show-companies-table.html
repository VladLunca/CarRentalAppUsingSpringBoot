<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Companies Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container mt-4">
    <h3>Companies</h3>
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-primary">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>City</th>
                <th>Street</th>
                <th>Street Number</th>
                <th>Delete</th>
                <th>Update</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="company : ${companies}">
                <td th:text="${company.carRentalCompanyName}"></td>
                <td th:text="${company.email}"></td>
                <td th:text="${company.phoneNumber}"></td>
                <td th:text="${company.address.cityName}"></td>
                <td th:text="${company.address.streetName}"></td>
                <td th:text="${company.address.streetNumber}"></td>
                <td>
                    <form action="#" th:action="@{/manager/rentalsCompanies/deleteCompany}" method="POST">
                        <input type="hidden" name="companyId" th:value="${company.carRentalCompanyId}">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Are you sure you want to delete this company?')">Delete
                        </button>
                    </form>
                </td>
                <td>
                    <form action="#" th:action="@{/manager/rentalsCompanies/updateCompany}" method="GET">
                        <input type="hidden" name="companyId" th:value="${company.carRentalCompanyId}">
                        <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="d-flex justify-content-between mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Back Home</a>
        <a th:href="@{/manager/rentalsCompanies/addCompany}" class="btn btn-primary">Add Company</a>
    </div>
</div>
</body>
</html>
