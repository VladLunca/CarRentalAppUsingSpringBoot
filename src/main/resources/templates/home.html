<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Company Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">
            <h2>&#128664; Good Rentals Home Page</h2>
        </div>
        <div class="card-body">

            <div sec:authorize="hasAuthority('ROLE_SUPER_ADMIN')" class="mb-4">
                <h5 class="text-primary">&#128737; Admin</h5>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/admin/staff}" class="btn btn-outline-primary btn-sm">
                        &#128101; Manage Accounts
                    </a>
                    <a th:href="@{/admin/rentalsCompanies/show}" class="btn btn-outline-primary btn-sm">
                        &#127970; Manage Companies
                    </a>
                </div>
            </div>

            <div sec:authorize="hasAuthority('ROLE_MANAGER')" class="mb-4">
                <h5 class="text-warning">&#128188; Manager</h5>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/manager/staff}" class="btn btn-outline-warning btn-sm">
                        &#128101; Manage Staff
                    </a>
                </div>
            </div>

            <div sec:authorize="hasAnyAuthority('ROLE_MANAGER','ROLE_EMPLOYEE')" class="mb-4">
                <h5 class="text-info">&#128188; Staff</h5>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/cars/showCars}" class="btn btn-outline-info btn-sm">
                        &#128663; Company Cars
                    </a>
                    <a th:href="@{/rentals/allRentals(view='man/emp')}" class="btn btn-outline-info btn-sm">
                        &#128202; All Rentals
                    </a>
                </div>
            </div>

            <div class="mb-4">
                <h5 class="text-success">&#128100; My Account</h5>
                <div class="d-flex gap-2 flex-wrap">
                    <a sec:authorize="!hasAuthority('ROLE_SUPER_ADMIN')" th:href="@{/cars/chooseDates}" class="btn btn-outline-success btn-sm">
                        &#128665; Rent a Car
                    </a>
                    <a th:href="@{/rentals/allRentals(view='client')}" class="btn btn-outline-success btn-sm">
                        &#129309; My Rentals
                    </a>
                    <a th:href="@{/profile/editProfile}" class="btn btn-outline-success btn-sm">
                        &#9881; Edit Profile
                    </a>
                </div>
            </div>

            <hr>

            <div class="text-center text-muted mb-3">
                <p>Welcome to "Good Rentals" car rental page!</p>
            </div>

            <div class="bg-light p-3 rounded mb-3">
                <div class="row">
                    <div class="col-md-6">
                        <strong>User: </strong>
                        <span class="text-primary" sec:authentication="principal.username"></span>
                    </div>
                    <div class="col-md-6">
                        <strong>Roles: </strong>
                        <span class="text-info" sec:authentication="principal.authorities"></span>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <form action="#" th:action="@{/logout}" method="POST">
                    <button type="submit" class="btn btn-outline-danger">
                         Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
