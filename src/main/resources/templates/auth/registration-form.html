<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Page</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container">
    <div id="loginbox" style="margin-top: 50px;" class="col-md-3 col-md-offset-2 col-sm-6 col-sm-offset-2">
        <div class="card border-info">
            <div class="card-header bg-info text-white">
                <h4>Registration</h4>
            </div>
            <div class="card-body">
                <div class="card-text">
                    <form action="#" th:action="@{/registration/process}"
                          th:object="${webUserDTO}"
                          method="POST" class="form-horizontal">

                        <div class="mb-3">
                            <input type="text" th:field="*{userName}" placeholder="Username (*)"
                                   class="form-control" th:classappend="${#fields.hasErrors('userName')} ? 'is-invalid'"/>
                            <div th:if="${#fields.hasErrors('userName')}" class="alert alert-danger mt-1">
                                <span th:errors="*{userName}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="text" th:field="*{firstName}" placeholder="First Name (*)"
                                   class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"/>
                            <div th:if="${#fields.hasErrors('firstName')}" class="alert alert-danger mt-1">
                                <span th:errors="*{firstName}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="text" th:field="*{lastName}" placeholder="Last Name (*)"
                                   class="form-control" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"/>
                            <div th:if="${#fields.hasErrors('lastName')}" class="alert alert-danger mt-1">
                                <span th:errors="*{lastName}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="password" th:field="*{password}" placeholder="Password (*)"
                                   class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                            <div th:if="${#fields.hasErrors('password')}" class="alert alert-danger mt-1">
                                <span th:errors="*{password}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="password" th:field="*{confirmPassword}" placeholder="Confirm Password (*)"
                                   class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"/>
                            <div th:if="${#fields.hasErrors('confirmPassword')}" class="alert alert-danger mt-1">
                                <span th:errors="*{confirmPassword}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="text" th:field="*{cnp}" placeholder="National ID (CNP) (*)"
                                   class="form-control" th:classappend="${#fields.hasErrors('cnp')} ? 'is-invalid'"/>
                            <div th:if="${#fields.hasErrors('cnp')}" class="alert alert-danger mt-1">
                                <span th:errors="*{cnp}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="text" th:field="*{phoneNumber}" placeholder="Phone Number (*)"
                                   class="form-control" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"/>
                            <div th:if="${#fields.hasErrors('phoneNumber')}" class="alert alert-danger mt-1">
                                <span th:errors="*{phoneNumber}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="email" th:field="*{email}" placeholder="Email (*)"
                                   class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                            <div th:if="${#fields.hasErrors('email')}" class="alert alert-danger mt-1">
                                <span th:errors="*{email}"></span>
                            </div>
                        </div>

                        <div style="margin-top: 10px" class="form-group">
                            <button type="submit" class="btn btn-primary">Register</button>
                        </div>
                    </form>
                    <div>
                        <a th:href="@{/login}"
                           class="btn btn-secondary mt-3"
                           role="button"
                           aria-pressed="true">Back to Log in</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
