<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Company</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow-sm" style="max-width: 600px; margin: auto;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">&#127970; Update Company</h4>
        </div>
        <div class="card-body">
            <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
                <strong>Warning:</strong> <span th:text="${warning}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <form th:action="@{/admin/rentalsCompanies/processUpdateCompany}" method="post">
                <input type="hidden" name="companyId" th:value="${company.id}"/>

                <div class="mb-3">
                    <label class="form-label">Company Name *</label>
                    <input type="text" name="name" th:value="${company.name}"
                           class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email" name="email" th:value="${company.email}"
                           class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number *</label>
                    <input type="text" name="phoneNumber" th:value="${company.phoneNumber}"
                           class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <input type="text" name="description" th:value="${company.description}"
                           class="form-control"/>
                </div>
                <hr/>
                <div class="mb-3">
                    <label class="form-label">City *</label>
                    <input type="text" name="cityName" th:value="${company.cityName}"
                           class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Street *</label>
                    <input type="text" name="streetName" th:value="${company.streetName}"
                           class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Street Number *</label>
                    <input type="number" name="streetNumber" th:value="${company.streetNumber}"
                           min="1" class="form-control" required/>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/admin/rentalsCompanies/show}" class="btn btn-primary">Back to Companies</a>
                    <button type="submit" class="btn btn-primary">Update Company</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I"
        crossorigin="anonymous"></script>
</body>
</html>
