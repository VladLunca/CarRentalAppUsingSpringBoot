<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Accounts - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">&#128737; Manage Accounts</h4>
        </div>
        <div class="card-body">

    <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong>Warning:</strong> <span th:text="${warning}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/admin/staff}" method="get" class="mb-4 mt-3">
        <div class="input-group">
            <input type="text" name="searchTerm" class="form-control"
                   placeholder="Search by username..." th:value="${searchTerm}"/>
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-primary">
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Phone Number</th>
                <th>CNP</th>
                <th>Email</th>
                <th>Company</th>
                <th>Assign Role</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody th:each="user : ${users}">
            <tr>
                <td th:text="${user.username}"></td>
                <td th:text="${user.role}"></td>
                <td th:text="${user.firstName}"></td>
                <td th:text="${user.lastName}"></td>
                <td th:text="${user.phoneNumber}"></td>
                <td th:text="${user.cnp}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <span class="d-block mb-1" th:text="${user.companyName}"></span>
                    <select name="companyId" th:attr="form='assign-form-' + ${user.id}"
                            class="form-select form-select-sm">
                        <option value="">-- No company --</option>
                        <option th:each="company : ${companies}"
                                th:value="${company.id}"
                                th:text="${company.name}">
                        </option>
                    </select>
                </td>
                <td>
                    <form th:id="'assign-form-' + ${user.id}"
                          th:action="@{/admin/staff/assign-role}" method="post">
                        <input type="hidden" name="userId" th:value="${user.id}"/>
                        <select name="role" class="form-select form-select-sm mb-1">
                            <option value="CUSTOMER">Customer</option>
                            <option value="EMPLOYEE">Employee</option>
                            <option value="MANAGER">Manager</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-warning"
                                onclick="return confirm('Assign this role to the user?')">
                            Assign Role
                        </button>
                    </form>
                </td>
                <td>
                    <form th:action="@{/admin/staff/toggle-status}" method="post">
                        <input type="hidden" name="userId" th:value="${user.id}"/>
                        <button type="submit"
                                th:text="${user.enabled} ? 'Disable' : 'Enable'"
                                th:class="${user.enabled} ? 'btn btn-sm btn-outline-danger' : 'btn btn-sm btn-outline-success'">
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="10" class="text-center text-muted">No users found.</td>
            </tr>
        </table>
    </div>

    <a th:href="@{/home}" class="btn btn-primary mt-3">Back Home</a>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I"
        crossorigin="anonymous"></script>
</body>
</html>
