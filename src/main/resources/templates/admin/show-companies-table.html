<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Companies Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">&#127970; Manage Companies</h4>
            <a th:href="@{/admin/rentalsCompanies/addCompany}" class="btn btn-light btn-sm">+ Add Company</a>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/rentalsCompanies/show}" method="get" class="mb-4 mt-3">
                <div class="input-group">
                    <input type="text" name="searchTerm" class="form-control"
                           placeholder="Search by name..." th:value="${searchTerm}"/>
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-primary">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>City</th>
                        <th>Street</th>
                        <th>Street Number</th>
                        <th>Description</th>
                        <th>Update</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="company : ${companies}">
                        <td th:text="${company.name}"></td>
                        <td th:text="${company.email}"></td>
                        <td th:text="${company.phoneNumber}"></td>
                        <td th:text="${company.cityName}"></td>
                        <td th:text="${company.streetName}"></td>
                        <td th:text="${company.streetNumber}"></td>
                        <td th:text="${company.description}"></td>
                        <td>
                            <form th:action="@{/admin/rentalsCompanies/updateCompany}" method="get">
                                <input type="hidden" name="companyId" th:value="${company.id}"/>
                                <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                            </form>
                        </td>
                        <td>
                            <form th:action="@{/admin/rentalsCompanies/deleteCompany}" method="post">
                                <input type="hidden" name="companyId" th:value="${company.id}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Are you sure you want to delete this company?')">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                    <tr th:if="${#lists.isEmpty(companies)}">
                        <td colspan="9" class="text-center text-muted">No companies found.</td>
                    </tr>
                </table>
            </div>
            </div>
            <a th:href="@{/home}" class="btn btn-primary mt-3">Back Home</a>
        </div>
    </div>
</div>
</body>
</html>
