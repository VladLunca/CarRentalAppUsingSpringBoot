<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
</head>
<body>
<div class="container mt-4">
    <h3>Users table</h3>
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-blue">
            <tr>
                <th>
                    Username
                    <a th:href="@{/manager/sortByUsernameAsc(property=username)}" class="btn btn-link btn-sm">Asc</a>

                    <a th:href="@{/manager/sortByUsernameDsc(property=username)}" class="btn btn-link btn-sm">Dsc</a>
                </th>
                <th>
                    Role
                    <a th:href="@{/manager/sortByUsernameAsc(property=role)}" class="btn btn-link btn-sm">Asc</a>

                    <a th:href="@{/manager/sortByUsernameDsc(property=role)}" class="btn btn-link btn-sm">Dsc</a>
                </th>
                <th>First Name
                    <a th:href="@{/manager/sortByUsernameAsc(property=userDetails.firstName)}"
                       class="btn btn-link btn-sm">Asc</a>

                    <a th:href="@{/manager/sortByUsernameDsc(property=userDetails.firstName)}"
                       class="btn btn-link btn-sm">Dsc</a>
                </th>
                <th>Last Name
                    <a th:href="@{/manager/sortByUsernameAsc(property=userDetails.lastName)}"
                       class="btn btn-link btn-sm">Asc</a>

                    <a th:href="@{/manager/sortByUsernameDsc(property=userDetails.lastName)}"
                       class="btn btn-link btn-sm">Dsc</a>
                </th>
                <th>Phone number</th>
                <th>CNP</th>
                <th>Email</th>
                <th>Car Rental Company
                    <a th:href="@{/manager/sortByUsernameAsc(property=userDetails.carRentalCompany)}"
                       class="btn btn-link btn-sm">Asc</a>
                    <a th:href="@{/manager/sortByUsernameDsc(property=userDetails.carRentalCompany)}"
                       class="btn btn-link btn-sm">Dsc</a>
                </th>
                <th>Change Role</th>
                <th>Delete User</th>
            </tr>
            </thead>
            <tbody th:each="user : ${users}">
            <tr>
                <td th:text="${user.getUsername()}"></td>
                <td th:text="${user.getRole()}"></td>
                <td th:text="${user.getUserDetails().getFirstName()}"></td>
                <td th:text="${user.getUserDetails().getLastName()}"></td>
                <td th:text="${user.getUserDetails().getPhoneNumber()}"></td>
                <td th:text="${user.getUserDetails().getCnp()}"></td>
                <td th:text="${user.getUserDetails().getEmail()}"></td>
                <td th:text="${user.getUserDetails().getCarRentalCompany()?.getCarRentalCompanyName()}"></td>
                <td>
                    <form action="#" th:action="@{/manager/switchRole}" method="POST">
                        <input type="hidden" name="_method" value="put"/>
                        <input th:type="hidden" name="user_id" th:value="${user.getUserId()}">
                        <select name="roles" th:value="${user.getRole()}">
                            <option value="COSTUMER">Costumer</option>
                            <option value="EMPLOYEE">Employee</option>
                            <option value="MANAGER">Manger</option>
                        </select>
                        <select name="carRentalCompany">
                            <option th:each="company : ${companies}"
                                    th:value="${company.getCarRentalCompanyId()}"
                                    th:text="${company.getCarRentalCompanyName()}"
                                    th:selected="${company == user.getUserDetails().getCarRentalCompany()}" th:default="${companies.first}">
                            </option>
                        </select>
                        <button type="submit"
                                class="btn btn-primary mt-3"
                                role="button"
                                aria-pressed="true">Change Role
                        </button>
                    </form>

                </td>
                <td>
                    <form action="#" th:action="@{/manager/deleteUser}" method="post">
                        <input th:type="hidden" name="user_id" th:value="${user.getUserId()}">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit"
                                class="btn btn-sm btn-outline-danger"
                                role="button"
                                onclick="return confirm('Are you sure you want to delete this user?')"
                                aria-pressed="true">Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div>
        <a th:href="@{/static}"
           class="btn btn-primary mt-3"
           role="button"
           aria-pressed="true">Back home</a>

    </div>
</div>
</body>
</html>
